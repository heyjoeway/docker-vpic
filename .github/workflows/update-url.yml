name: Update VPIC URL

permissions:
  contents: write
  actions: write # needed to dispatch the Docker workflow

on:
  schedule:
    - cron: "0 0 * * *" # daily
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Get latest VPIC ZIP URL
        id: vpic
        run: |
          URL=$(python get_url.py)
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Update Dockerfile if needed
        run: |
          set -e

          NEW_URL="${{ steps.vpic.outputs.url }}"
          OLD_URL=$(grep -E '^ENV VPIC_URL=' Dockerfile | cut -d= -f2-)

          echo "Old URL: $OLD_URL"
          echo "New URL: $NEW_URL"

          if [ "$OLD_URL" = "$NEW_URL" ]; then
            echo "URL unchanged"
            exit 0
          fi

          sed -i "s|^ENV VPIC_URL=.*|ENV VPIC_URL=$NEW_URL|" Dockerfile

      - name: Commit and push changes
        id: commit
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add Dockerfile
          git commit -m "Update VPIC download URL"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so the
      # Docker build has to be started explicitly. workflow_dispatch is exempt
      # from that restriction.
      - name: Trigger Docker build
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docker.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
